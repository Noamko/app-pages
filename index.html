<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="ggs-page" content="c78e217fd4668afb">
<title>Apps by Noam Koren</title>
<style>:root{color-scheme:light dark;--bg:#f6f7f9;--card:#fff;--text:#15171c;--dim:#4b5261;--line:#e4e6eb;--link:#0b6a61;--tag-bg:#e8f3f1;--tag:#0b6a61}
@media (prefers-color-scheme:dark){:root{--bg:#111318;--card:#1a1d23;--text:#eceef2;--dim:#a3a9b5;--line:#2a2e36;--link:#5fd0c2;--tag-bg:#16302d;--tag:#7fdccf}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
main{max-width:680px;margin:0 auto;padding:40px 16px 56px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:28px clamp(18px,5vw,40px)}
.tag{display:inline-block;font-weight:600;font-size:12.5px;padding:3px 8px;border-radius:4px;background:var(--tag-bg);color:var(--tag);margin-bottom:12px}
h1{margin:0 0 6px;font-size:28px;line-height:1.2}
h2{font-size:17px;margin:26px 0 4px}
p{margin:8px 0}
.dim{color:var(--dim);font-size:14px}
.lead{font-size:18px;color:var(--dim);margin-top:0}
a{color:var(--link)}
ul{padding-left:20px}
footer{margin-top:22px;text-align:center;color:var(--dim);font-size:13px}</style>
</head>
<body>
<main>
<div class="card">
<h1>Apps by Noam Koren</h1>
<ul><li><strong>PlanterPal</strong>: <a href="planterpal/support.html">Support</a> · <a href="planterpal/privacy.html">Privacy Policy</a></li></ul>
</div>
<footer></footer>
</main>
</body>
</html>
